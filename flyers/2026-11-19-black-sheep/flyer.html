<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Last Call × Les Espanters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Merriweather:ital,wght@0,400;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 0; }
html, body { margin: 0; padding: 0; }
body { background: #FEFCE8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print { #flyer { width: 210mm !important; height: 297mm !important; } }
</style>
</head>
<body>
<div id="flyer" style="position: relative; width: 794px; height: 1123px; overflow: hidden; display: flex; flex-direction: column; background-color: #FEFCE8; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px)">

  <!-- LAST CALL -->
  <section style="position: relative; flex: none; height: 454px; background: #1a1611; overflow: hidden">
    <img src="../../last-call/public/stage.png" alt="Last Call sur scène, guitare et banjo, illustration sépia" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; display: block">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,22,17,0.4) 0%, rgba(26,22,17,0) 12%, rgba(26,22,17,0) 52%, rgba(26,22,17,0.8) 62%, rgba(26,22,17,0.94) 76%, #1a1611 90%)"></div>
    <div style="position: absolute; left: 40px; right: 40px; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <h1 style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 600; font-size: 120px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; color: #f5f5dc">Last <span style="color: #ff6347">Call</span></h1>
      <p style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 500; font-size: 15px; line-height: 1.2; letter-spacing: 0.35em; text-transform: uppercase; color: #daa520">Duo country · western · americana</p>
      <p style="margin: 0; font-family: Merriweather, Georgia, serif; font-size: 19px; line-height: 1.4; color: #f4a460">L’esprit de l’Ouest américain dans le Sud de la France</p>
    </div>
  </section>

  <!-- INFOS -->
  <section style="flex: none; height: 176px; box-sizing: border-box; background: #CA7625; border-top: 6px solid #0D0E08; border-bottom: 6px solid #0D0E08; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0D0E08; text-align: center">
    <p style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.2; letter-spacing: 0.45em; text-transform: uppercase">En concert</p>
    <p style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase">Jeudi 19 novembre · 20h</p>
    <div style="margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 14px">
      <img src="black-sheep/sheep-head.png" alt="Tête de bélier du Black Sheep" style="display: block; height: 66px; width: auto">
      <img src="black-sheep/wordmark.png" alt="The Black Sheep" style="display: block; height: 56px; width: auto">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-family: Merriweather, Georgia, serif; font-size: 16px; line-height: 1.3; text-align: left">
        <p style="margin: 0">21 bd Louis Blanc</p>
        <p style="margin: 0">Montpellier</p>
      </div>
    </div>
  </section>

  <!-- LES ESPANTERS -->
  <section style="position: relative; flex: 1; min-height: 0; background: #0D0E08">
    <div style="position: absolute; inset: 0; overflow: hidden">
      <img src="../../les-espanters/public/laugh.png" alt="Les Espanters jouent aux cartes et éclatent de rire, illustration BD" style="position: absolute; left: 0; top: -44px; width: 100%; height: auto; display: block">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,14,8,0) 0%, rgba(13,14,8,0) 56%, rgba(13,14,8,0.8) 68%, rgba(13,14,8,0.94) 84%, #0D0E08 100%)"></div>
    </div>
    <div style="position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <h2 style="margin: 0; font-family: Bangers, Impact, sans-serif; font-weight: 400; font-size: 92px; line-height: 1; letter-spacing: 0.05em; color: #fff; text-shadow: 4px 4px 0 #795B1A, 8px 8px 0 #3F2E10, 12px 12px 0 #0D0E08; transform: skew(-5deg, -2deg)">Les Espanters</h2>
      <div style="display: flex; align-items: center; gap: 10px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="display: block"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="#FFD93D" stroke="#0D0E08" stroke-width="1.6" stroke-linejoin="round"></path></svg>
        <p style="margin: 0; font-family: Bangers, Impact, sans-serif; font-size: 26px; line-height: 1; letter-spacing: 0.05em; color: #fff; text-shadow: 2px 2px 0 #0D0E08, -1px -1px 0 #0D0E08, 1px -1px 0 #0D0E08, -1px 1px 0 #0D0E08">Folie méditerranéenne explosive</p>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="display: block"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="#FFD93D" stroke="#0D0E08" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </div>
      <p style="margin: 8px 0 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 14px; line-height: 1.2; letter-spacing: 0.06em; color: #eddaba">last-call.lourock.com · les-espanters.lourock.com</p>
    </div>

    <svg aria-hidden="true" width="64" height="80" viewBox="0 0 24 30" style="position: absolute; right: 14px; top: -34px; transform: rotate(-12deg)">
      <path d="M14 2 3 17h9l-1.5 11L22 13h-9l1-11z" fill="#FFD93D" stroke="#0D0E08" stroke-width="1.3" stroke-linejoin="round"></path>
    </svg>
    <svg aria-hidden="true" width="118" height="118" viewBox="-4 -4 128 128" style="position: absolute; left: 6px; top: -34px; transform: rotate(12deg)">
      <polygon points="118,60 96.7,69.8 106.8,87 86.9,86.9 89,110.2 69.8,96.7 60,112 50.2,96.7 31,110.2 33.1,86.9 12.4,87.5 23.3,69.8 2,60 23.3,50.2 14.1,33.5 33.1,33.1 31,9.8 50.2,23.3 60,6 69.8,23.3 89,9.8 86.9,33.1 107.6,32.5 96.7,50.2" fill="#FFD93D" stroke="#0D0E08" stroke-width="4" stroke-linejoin="round"></polygon>
      <text x="60" y="71" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="30" letter-spacing="1" fill="#FF6B6B" stroke="#0D0E08" stroke-width="2" paint-order="stroke">BOUM!</text>
    </svg>
  </section>
</div>
</body>
</html>
